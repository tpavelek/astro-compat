<title>Astro Compat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap">
<style>
/* Layout: tab bar under a compact header; one content column (max 1080px); chart wheel beside its table on desktop, stacked on phones. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --surface-2:#f6f7fb; --fg:#1c1f2e; --muted:#5d6279; --line:#d6d9e5;
  --accent:#5a46a8; --accent-soft:#e9e4f8; --on-accent:#ffffff; --gold:#9a7a1c; --danger:#b3261e;
  --fire:#d9542c; --earth:#1a9a84; --air:#c9a227; --water:#2f6fc4;
  --font-display:"Fraunces","Iowan Old Style","Georgia",serif; --font-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,24,50,.06),0 6px 18px rgba(20,24,50,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1225; --surface:#181c33; --surface-2:#1f2440; --fg:#e9e6f5; --muted:#a2a4bf; --line:#2d3253;
  --accent:#b9a6ff; --accent-soft:#2a2650; --on-accent:#12102a; --gold:#e4c66b; --danger:#ff8a80;
  --fire:#e0603a; --earth:#2fa58e; --air:#b09230; --water:#5b93ea; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1225; --surface:#181c33; --surface-2:#1f2440; --fg:#e9e6f5; --muted:#a2a4bf; --line:#2d3253;
  --accent:#b9a6ff; --accent-soft:#2a2650; --on-accent:#12102a; --gold:#e4c66b; --danger:#ff8a80;
  --fire:#e0603a; --earth:#2fa58e; --air:#b09230; --water:#5b93ea; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:44px;height:44px;flex:none}
.brand p{font-size:.9rem;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font-weight:700;letter-spacing:.04em;font-size:.82rem}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid-2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person{display:flex;flex-direction:column;gap:8px;min-width:0}
.person .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person .name h3{overflow-wrap:anywhere}
.big3{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.pill .g{font-size:.95rem}
.person .actions{display:flex;gap:6px;margin-top:4px}
.person .actions .btn{padding:5px 10px;font-size:.85rem}
.sample{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

form.edit{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
@media (max-width:560px){form.edit{grid-template-columns:1fr}}
form.edit .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--fg)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1}
.err{color:var(--danger);font-size:.9rem;grid-column:1/-1}

/* chart */
.chart-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.chart-wrap{grid-template-columns:1fr}}
svg.wheel{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}
table.pl{width:100%;border-collapse:collapse;font-size:.93rem}
table.pl th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.pl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pl tr:last-child td{border-bottom:0}
table.pl .g{font-size:1.1rem;width:28px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.el-fire{color:var(--fire)} .el-earth{color:var(--earth)} .el-air{color:var(--air)} .el-water{color:var(--water)}
.bg-fire{background:var(--fire)} .bg-earth{background:var(--earth)} .bg-air{background:var(--air)} .bg-water{background:var(--water)}

/* traits */
.trait{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.trait .g{font-family:var(--font-display);font-size:1.9rem;line-height:1;text-align:center;padding-top:2px}
.trait h3 span{color:var(--muted);font-weight:500}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.bar{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* compat */
.pair-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media (max-width:560px){.pair-pick{grid-template-columns:1fr}}
.pair-pick .vs{font-family:var(--font-display);color:var(--muted);text-align:center}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.ring{width:120px;height:120px}
.score h2{font-size:1.6rem}
.verdict{font-family:var(--font-display);font-size:1.25rem}
.factors{display:flex;flex-direction:column;gap:10px}
.factor{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.factor .t{font-weight:700}
.factor .d{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.factor .s{font-weight:700;font-variant-numeric:tabular-nums}
.factor.pos .s{color:var(--earth)} .factor.neg .s{color:var(--fire)}

/* matrix */
.matrix-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px;font-size:.9rem}
table.mx th{font-weight:700;padding:6px 8px;text-align:left;white-space:nowrap;color:var(--muted);font-size:.85rem}
table.mx th.col{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;vertical-align:bottom;padding:8px 2px}
table.mx td{width:56px;height:44px;text-align:center;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;position:relative}
table.mx td.self{background:var(--surface-2);color:var(--muted);cursor:default}
table.mx td.hi{color:var(--on-accent)}
.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.85rem;color:var(--muted)}
.legend .ramp{width:140px;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--accent))}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:.85rem;z-index:5;max-width:260px}

footer{margin-top:28px;font-size:.84rem;color:var(--muted);max-width:68ch}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:all .5s ease}}

/* v3 additions: place search, guide, aspects list, meaning column */
.place{position:relative}
.suggest{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:280px;overflow-y:auto;margin-top:4px}
.suggest button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);padding:8px 10px;font-weight:500}
.suggest button:hover,.suggest button.act{background:var(--accent-soft)}
.suggest .m{color:var(--muted);font-size:.85rem;white-space:nowrap}
.picked{font-size:.9rem;color:var(--fg);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picked .ok{color:var(--earth);font-weight:700}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:700;font-size:.85rem;text-decoration:underline}
table.pl td.sg{white-space:nowrap}
table.pl td.mean{color:var(--muted);font-size:.85rem}
table.pl td[title]{cursor:help;text-decoration:underline dotted var(--line);text-underline-offset:3px}
.asp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;font-size:.92rem}
.asp-list .a{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.asp-list .sym{font-size:1.05rem;width:1.3em;text-align:center}
.asp-list .hard .sym{color:var(--fire)} .asp-list .soft .sym{color:var(--earth)} .asp-list .conj .sym{color:var(--accent)}
.guide{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.guide{grid-template-columns:1fr}.guide nav{display:flex;flex-wrap:wrap;gap:6px;position:static}}
.guide nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
.guide nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:4px 8px;border-radius:6px}
.guide nav a:hover{background:var(--accent-soft);color:var(--fg)}
.guide article{max-width:68ch}
.guide section{margin-bottom:28px}
.guide h2{margin-bottom:8px;font-size:1.4rem}
.guide h3{margin:14px 0 4px}
.guide p{margin-bottom:10px}
.guide ul{margin:0 0 10px;padding-left:20px}
.guide li{margin-bottom:4px}
.guide table{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:12px}
.guide th,.guide td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.guide th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.guide .g{font-size:1.1rem;width:1.5em;display:inline-block}
.engine{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-top:6px}
.engine i{width:8px;height:8px;border-radius:50%;background:var(--earth);display:inline-block}
.engine.fb i{background:var(--air)}
.hsel{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.hsel select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
/* v4: compact card controls, tooltip layer */
.person .actions .btn{padding:4px 9px;font-size:.78rem;border-radius:6px}
.person .actions{gap:5px}
.big3 .pill{font-size:.76rem;padding:2px 7px}
.tip{white-space:pre-line;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:300px}
[data-tip]{cursor:help}
button[data-tip],a[data-tip],select[data-tip],input[data-tip],.chip[data-tip],td[data-i][data-tip]{cursor:pointer}
.term{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
</style>

<div class="wrap">
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="22" cy="22" r="12" fill="none" stroke="var(--line)" stroke-width="1"/><circle cx="22" cy="22" r="3" fill="var(--gold)"/><circle cx="22" cy="6" r="2" fill="var(--accent)"/><circle cx="34" cy="30" r="2" fill="var(--accent)"/><circle cx="10" cy="30" r="2" fill="var(--accent)"/></svg>
    <div><h1>Astro Compat</h1><p data-i="tagline"></p></div>

  <div class="lang" role="group" aria-label="Language">

</header>

  <button role="tab" data-tab="compat" data-i="tab_compat"></button>
  <button role="tab" data-tab="matrix" data-i="tab_matrix"></button>
  <button role="tab" data-tab="guide" data-i="tab_guide"></button>
</nav>

<main id="main"></main>

<footer><p id="disclaimer"></p></footer>

/* ============ ASTRO ENGINE ============

    const p={};for(const x of f.formatToParts(new Date(utcMs)))p[x.type]=x.value;

     moonLon+=-1.274*sin(Mm-2*D)+0.658*sin(2*D)-0.186*sin(Ms)-0.059*sin(2*Mm-2*D)-0.057*sin(Mm-2*D+Ms)+0.053*sin(Mm+2*D)+0.046*sin(2*D-Ms)+0.041*sin(Mm-Ms)-0.035*sin(D)-0.031*sin(Mm+Ms)-0.015*sin(2*F-2*D)+0.011*sin(Mm-4*D)}

  elpairs:{'fire-fire':'Two flames: passionate, fast, loud and occasionally a wildfire.','earth-earth':'Two rocks: stable, loyal, practical, possibly a little dull on a Saturday night.','air-air':'Two breezes: endless talk, shared ideas, few dishes done.','water-water':'Two oceans: deep empathy and moods that amplify each other.','fire-air':'Air feeds fire: inspiration, fun and momentum; someone has to remember the keys.','earth-water':'Water nourishes earth: nurturing, secure and homely; watch out for stagnation.','fire-earth':'Fire wants to go, earth wants a plan. Productive when they listen, exhausting when they do not.','air-water':'Air thinks, water feels. Fascinating and confusing in equal measure.','fire-water':'Steam. The attraction is strong, so is the risk of someone being put out.','earth-air':'Earth wants it done, air wants it discussed. Works with patience on both sides.'},
  guide:{
   nav:['What a natal chart is','The big three','Planets','Signs, elements, modalities','Houses','Aspects','The compatibility score','Accuracy and limits'],
   intro:`<p>A natal (birth) chart is a map of the sky at the moment and place you were born, drawn from the Earth's point of view. The ring is the <strong>zodiac</strong>: the Sun's yearly path split into twelve 30° slices, the signs. Each planet is placed on that ring by its <strong>ecliptic longitude</strong> (0° = start of Aries). The Earth also turns once a day, so the chart is rotated by birth time and place: that rotation gives the <strong>Ascendant</strong> and the <strong>houses</strong>.</p><p>Pop astrology reads it in three layers: <em>what</em> (the planet: which part of you), <em>how</em> (the sign: the style it works in) and <em>where</em> (the house: the area of life it shows up in).</p>`,
   big3:`<ul><li><strong>Sun</strong>: your core identity, will and vitality. This is the "star sign" from horoscope columns. It changes sign roughly once a month.</li><li><strong>Moon</strong>: feelings, instincts, what you need to feel safe, how you were mothered and how you nurture. It moves about 13° a day, so it changes sign every 2–3 days; a wrong birth time can shift it a few degrees.</li><li><strong>Ascendant (rising sign)</strong>: the sign that was rising on the eastern horizon. Your first impression, body language, the "mask" and the way you start things. It changes sign about every two hours, which is why birth time matters.</li></ul>`,
   planets:`<p>Each planet is a function. The sign it is in describes the style; the house, the life area.</p>`,
   signs:`<p>Each sign combines one <strong>element</strong> (its temperament) with one <strong>modality</strong> (its way of acting). The same element tends to get along; the same modality tends to compete.</p><h3>Elements</h3><ul><li><strong>Fire</strong> (Aries, Leo, Sagittarius): energy, enthusiasm, action, ego.</li><li><strong>Earth</strong> (Taurus, Virgo, Capricorn): practicality, patience, senses, money.</li><li><strong>Air</strong> (Gemini, Libra, Aquarius): ideas, talk, social life, detachment.</li><li><strong>Water</strong> (Cancer, Scorpio, Pisces): feelings, intuition, memory, empathy.</li></ul><h3>Modalities</h3><ul><li><strong>Cardinal</strong> (Aries, Cancer, Libra, Capricorn): starts things, leads, initiates.</li><li><strong>Fixed</strong> (Taurus, Leo, Scorpio, Aquarius): sustains, persists, resists change.</li><li><strong>Mutable</strong> (Gemini, Virgo, Sagittarius, Pisces): adapts, finishes, changes shape.</li></ul>`,
   houses:`<p>Houses are twelve areas of life. House 1 starts at the Ascendant (left side of the wheel), house 10 at the Midheaven (top). A planet "in the 7th house" shows up in partnerships, and so on.</p><p>This app uses the <strong>Placidus</strong> system, the default in most Western software: it divides the time a point on the ecliptic takes to rise and culminate, so houses are unequal in size and depend on latitude. Above the polar circles (±66°) Placidus breaks down and the app falls back to equal 30° houses from the Ascendant. You can switch to equal houses on the Chart tab.</p>`,
   aspects:`<p>Aspects are angles between two planets. Within a tolerance (the <strong>orb</strong>) they are read as a relationship:</p><table><tr><th></th><th>Aspect</th><th>Angle</th><th>Orb used</th><th>Meaning</th></tr><tr><td class="g">☌</td><td>Conjunction</td><td>0°</td><td>8°</td><td>Fused: the two planets act as one, intensified.</td></tr><tr><td class="g">⚹</td><td>Sextile</td><td>60°</td><td>5°</td><td>Easy opportunity; mild harmony you have to use.</td></tr><tr><td class="g">□</td><td>Square</td><td>90°</td><td>7°</td><td>Tension, friction; growth through effort.</td></tr><tr><td class="g">△</td><td>Trine</td><td>120°</td><td>8°</td><td>Natural flow, talent, things come easily.</td></tr><tr><td class="g">☍</td><td>Opposition</td><td>180°</td><td>8°</td><td>Polarity: attraction and conflict, awareness through the other.</td></tr></table><p>On the wheel, green lines are harmonious (trine, sextile), red lines are tense (square, opposition). In a chart they describe one person; between two charts (synastry) they describe how the people meet.</p>`,
   score:`<p>The score is a weighted blend of ten classic synastry pairings. Each pairing gets a value from 0.2 (square) to 1.0 (conjunction), 0.5 if there is no aspect, and some blend in element affinity (same element 0.9; fire–air and earth–water 0.8; fire–earth and air–water 0.45; fire–water and earth–air 0.35).</p><table><tr><th>Pairing</th><th>Weight</th><th>What it measures</th></tr><tr><td>Sun – Sun</td><td>1.5</td><td>Element and modality affinity of the core selves</td></tr><tr><td>Moon – Moon</td><td>1.5</td><td>Aspect + element: do you need the same things?</td></tr><tr><td>Sun – Moon (both directions)</td><td>1.0 each</td><td>Does one's nature feed the other's needs? The classic marriage indicator.</td></tr><tr><td>Venus – Mars (both directions)</td><td>1.0 each</td><td>Romantic and physical attraction</td></tr><tr><td>Venus – Venus</td><td>0.8</td><td>Love languages and taste</td></tr><tr><td>Mars – Mars</td><td>0.6</td><td>Friction; a conjunction here counts as competitive</td></tr><tr><td>Ascendant – Sun (both directions)</td><td>0.5 each</td><td>First impression</td></tr></table><p>The weighted average is stretched to 0–99: 85+ "written in the stars", 70+ strong, 55+ workable, 40+ challenging, below that a cosmic mismatch. The breakdown lists each pairing with its contribution in points. This is a stereotype heuristic: real synastry also looks at houses, the outer planets, composite charts and, mostly, the people.</p>`,
   accuracy:`<ul><li><strong>Planet positions</strong> come from the astronomy-engine library (VSOP87/ELP-based), accurate to about one arcminute; if it fails to load, a simplified model (about 1°) is used and the footer says so.</li><li><strong>Time</strong>: the birth time is converted to UTC using your browser's time-zone database, including historical daylight saving. If the time is unknown, noon is used: the Moon can be off by up to 7°, and the Ascendant and houses are guesses.</li><li><strong>Place</strong>: the town list is GeoNames (every Czech and Slovak town over 500 inhabitants, neighbouring countries over 15,000, the rest of the world over 50,000). Any place can be entered by coordinates.</li><li><strong>Zodiac</strong> is tropical (Western), the one used in European and American pop astrology. Vedic astrology uses the sidereal zodiac, about 24° earlier.</li></ul>`}},

  elpairs:{'fire-fire':'Dva plameny: vášnivé, rychlé, hlučné a občas lesní požár.','earth-earth':'Dva kameny: stabilní, věrní, praktičtí, v sobotu večer možná trochu nuda.','air-air':'Dva vánky: nekonečné rozhovory, společné nápady, málo umytého nádobí.','water-water':'Dva oceány: hluboká empatie a nálady, které se navzájem zesilují.','fire-air':'Vzduch živí oheň: inspirace, zábava a tah na branku; někdo si musí pamatovat klíče.','earth-water':'Voda zavlažuje zemi: pečující, bezpečné a domácké; pozor na stojaté vody.','fire-earth':'Oheň chce vyrazit, země chce plán. Produktivní, když si naslouchají, vyčerpávající, když ne.','air-water':'Vzduch myslí, voda cítí. Fascinující i matoucí stejným dílem.','fire-water':'Pára. Přitažlivost je silná, stejně jako riziko, že někdo uhasne.','earth-air':'Země to chce mít hotové, vzduch to chce probrat. Funguje s trpělivostí na obou stranách.'},
  guide:{
   nav:['Co je horoskop','Velká trojka','Planety','Znamení, živly, kvality','Domy','Aspekty','Skóre shody','Přesnost a meze'],
   intro:`<p>Horoskop narození (nativita) je mapa oblohy v okamžiku a na místě vašeho narození, kreslená z pohledu Země. Prstenec je <strong>zvěrokruh</strong>: roční dráha Slunce rozdělená na dvanáct dílů po 30°, znamení. Každá planeta se do něj umístí podle své <strong>ekliptikální délky</strong> (0° = začátek Berana). Země se navíc jednou denně otočí, takže horoskop je natočen podle času a místa narození: z toho vzniká <strong>Ascendent</strong> a <strong>domy</strong>.</p><p>Populární astrologie to čte ve třech vrstvách: <em>co</em> (planeta: která část vás), <em>jak</em> (znamení: styl, jakým působí) a <em>kde</em> (dům: oblast života, kde se to projeví).</p>`,
   big3:`<ul><li><strong>Slunce</strong>: jádro osobnosti, vůle, vitalita. To je „znamení“ z novinových horoskopů. Mění se zhruba jednou za měsíc.</li><li><strong>Měsíc</strong>: city, instinkty, co potřebujete k pocitu bezpečí, jak jste byli opečováváni a jak pečujete. Posune se asi o 13° denně, znamení mění každé 2–3 dny; špatný čas narození ho může posunout o několik stupňů.</li><li><strong>Ascendent</strong>: znamení, které právě vycházelo na východním obzoru. První dojem, řeč těla, „maska“ a způsob, jakým začínáte. Mění se asi každé dvě hodiny, proto na čase narození záleží.</li></ul>`,
   planets:`<p>Každá planeta je jedna funkce. Znamení, ve kterém stojí, popisuje styl; dům oblast života.</p>`,
   signs:`<p>Každé znamení spojuje jeden <strong>živel</strong> (temperament) a jednu <strong>kvalitu</strong> (způsob jednání). Stejný živel si obvykle rozumí; stejná kvalita spíš soupeří.</p><h3>Živly</h3><ul><li><strong>Oheň</strong> (Beran, Lev, Střelec): energie, nadšení, akce, ego.</li><li><strong>Země</strong> (Býk, Panna, Kozoroh): praktičnost, trpělivost, smysly, peníze.</li><li><strong>Vzduch</strong> (Blíženci, Váhy, Vodnář): myšlenky, řeč, společenský život, odstup.</li><li><strong>Voda</strong> (Rak, Štír, Ryby): city, intuice, paměť, empatie.</li></ul><h3>Kvality</h3><ul><li><strong>Kardinální</strong> (Beran, Rak, Váhy, Kozoroh): začíná, vede, iniciuje.</li><li><strong>Pevné</strong> (Býk, Lev, Štír, Vodnář): udržuje, vytrvává, brání se změně.</li><li><strong>Proměnlivé</strong> (Blíženci, Panna, Střelec, Ryby): přizpůsobuje se, dokončuje, mění tvar.</li></ul>`,
   houses:`<p>Domy jsou dvanáct oblastí života. První dům začíná na Ascendentu (levá strana kola), desátý na Středu nebes (nahoře). Planeta „v 7. domě“ se projevuje v partnerství, a tak dále.</p><p>Aplikace používá systém <strong>Placidus</strong>, výchozí ve většině západních programů: dělí čas, za který bod ekliptiky vyjde a vykulminuje, takže domy jsou nestejně velké a závisí na zeměpisné šířce. Za polárními kruhy (±66°) Placidus selhává a aplikace přejde na rovné domy po 30° od Ascendentu. Na záložce Horoskop lze rovné domy zvolit ručně.</p>`,
   aspects:`<p>Aspekty jsou úhly mezi dvěma planetami. V rámci tolerance (<strong>orbis</strong>) se čtou jako vztah:</p><table><tr><th></th><th>Aspekt</th><th>Úhel</th><th>Orbis</th><th>Význam</th></tr><tr><td class="g">☌</td><td>Konjunkce</td><td>0°</td><td>8°</td><td>Splynutí: planety působí jako jedna, zesíleně.</td></tr><tr><td class="g">⚹</td><td>Sextil</td><td>60°</td><td>5°</td><td>Snadná příležitost; mírný soulad, který je třeba využít.</td></tr><tr><td class="g">□</td><td>Kvadratura</td><td>90°</td><td>7°</td><td>Napětí, tření; růst skrze úsilí.</td></tr><tr><td class="g">△</td><td>Trigon</td><td>120°</td><td>8°</td><td>Přirozený tok, nadání, věci jdou samy.</td></tr><tr><td class="g">☍</td><td>Opozice</td><td>180°</td><td>8°</td><td>Polarita: přitažlivost i konflikt, uvědomění skrze druhého.</td></tr></table><p>Na kole jsou zelené čáry harmonické (trigon, sextil), červené napjaté (kvadratura, opozice). V jednom horoskopu popisují člověka; mezi dvěma horoskopy (synastrie) popisují, jak se ti dva potkávají.</p>`,
   score:`<p>Skóre je vážený průměr deseti klasických synastrických dvojic. Každá dvojice dostane hodnotu od 0,2 (kvadratura) po 1,0 (konjunkce), 0,5 bez aspektu, a některé přimíchávají shodu živlů (stejný živel 0,9; oheň–vzduch a země–voda 0,8; oheň–země a vzduch–voda 0,45; oheň–voda a země–vzduch 0,35).</p><table><tr><th>Dvojice</th><th>Váha</th><th>Co měří</th></tr><tr><td>Slunce – Slunce</td><td>1,5</td><td>Shoda živlu a kvality základních povah</td></tr><tr><td>Měsíc – Měsíc</td><td>1,5</td><td>Aspekt + živel: potřebujete totéž?</td></tr><tr><td>Slunce – Měsíc (oběma směry)</td><td>1,0 každá</td><td>Sytí povaha jednoho potřeby druhého? Klasický ukazatel manželství.</td></tr><tr><td>Venuše – Mars (oběma směry)</td><td>1,0 každá</td><td>Romantická a fyzická přitažlivost</td></tr><tr><td>Venuše – Venuše</td><td>0,8</td><td>Jazyky lásky a vkus</td></tr><tr><td>Mars – Mars</td><td>0,6</td><td>Tření; konjunkce se zde počítá jako soupeření</td></tr><tr><td>Ascendent – Slunce (oběma směry)</td><td>0,5 každá</td><td>První dojem</td></tr></table><p>Vážený průměr se roztáhne na 0–99: 85+ „psáno ve hvězdách“, 70+ silná shoda, 55+ dá se, 40+ náročné, níže kosmický nesoulad. Rozbor vypisuje každou dvojici s jejím příspěvkem v bodech. Jde o stereotypní heuristiku: skutečná synastrie se dívá i na domy, vnější planety, kompozitní horoskopy a hlavně na ty dva lidi.</p>`,
   accuracy:`<ul><li><strong>Pozice planet</strong> počítá knihovna astronomy-engine (na základě VSOP87/ELP) s přesností asi jedné úhlové minuty; pokud se nenačte, použije se zjednodušený model (asi 1°) a patička to oznámí.</li><li><strong>Čas</strong>: čas narození se převádí na UTC podle databáze časových pásem v prohlížeči, včetně historického letního času. Při neznámém čase se použije poledne: Měsíc může být až o 7° jinde a Ascendent i domy jsou odhad.</li><li><strong>Místo</strong>: seznam obcí je z GeoNames (všechny české a slovenské obce nad 500 obyvatel, sousední země nad 15 000, zbytek světa nad 50 000). Jakékoli místo lze zadat souřadnicemi.</li><li><strong>Zvěrokruh</strong> je tropický (západní), používaný v evropské a americké populární astrologii. Védská astrologie používá siderický zvěrokruh, posunutý asi o 24° zpět.</li></ul>`}}

/* ============ ASTROLOGY HELPERS ============ */
const signOf=lon=>SIGNS[Math.floor(ENGINE.rev(lon)/30)];
const degIn=lon=>ENGINE.rev(lon)%30;
const fmtDeg=lon=>{const d=degIn(lon),a=Math.floor(d),m=Math.floor((d-a)*60);return `${a}°${String(m).padStart(2,'0')}′`};
const houseOf=(lon,c)=>{for(let i=1;i<=12;i++){const n=i%12+1;if(ENGINE.rev(lon-c[i])<ENGINE.rev(c[n]-c[i]))return i}return 12};
const ASPECTS=[['conjunction',0,8,1.0],['opposition',180,8,0.45],['trine',120,8,0.9],['square',90,7,0.2],['sextile',60,5,0.75]];
function aspect(a,b){let d=Math.abs(ENGINE.rev(a)-ENGINE.rev(b));if(d>180)d=360-d;for(const [t,ang,orb,s] of ASPECTS){const o=Math.abs(d-ang);if(o<=orb)return {type:t,orb:o,score:s}}return {type:'none',orb:null,score:0.5}}
const ELAFF={'fire-fire':.9,'earth-earth':.9,'air-air':.9,'water-water':.9,'fire-air':.8,'earth-water':.8,'fire-earth':.45,'air-water':.45,'fire-water':.35,'earth-air':.35};
const elKey=(a,b)=>ELAFF[`${a}-${b}`]!==undefined?`${a}-${b}`:`${b}-${a}`;
function modAff(a,b){if(a!==b)return .65;return {cardinal:.5,fixed:.4,mutable:.7}[a]}
function compat(A,B){
  const ca=A.chart,cb=B.chart,sa=signOf(ca.sun),sb=signOf(cb.sun),f=[];
  f.push({k:'sunSun',w:1.5,s:.7*ELAFF[elKey(sa.el,sb.el)]+.3*modAff(sa.mod,sb.mod),asp:aspect(ca.sun,cb.sun)});
  const mm=aspect(ca.moon,cb.moon);f.push({k:'moonMoon',w:1.5,s:.5*mm.score+.5*ELAFF[elKey(signOf(ca.moon).el,signOf(cb.moon).el)],asp:mm});
  let x=aspect(ca.sun,cb.moon);f.push({k:'sunMoonAB',w:1,s:x.score,asp:x});
  x=aspect(cb.sun,ca.moon);f.push({k:'sunMoonBA',w:1,s:x.score,asp:x});
  x=aspect(ca.venus,cb.mars);f.push({k:'venusMarsAB',w:1,s:x.type==='opposition'?.6:x.type==='square'?.35:x.score,asp:x});
  x=aspect(cb.venus,ca.mars);f.push({k:'venusMarsBA',w:1,s:x.type==='opposition'?.6:x.type==='square'?.35:x.score,asp:x});
  x=aspect(ca.venus,cb.venus);f.push({k:'venusVenus',w:.8,s:.5*x.score+.5*ELAFF[elKey(signOf(ca.venus).el,signOf(cb.venus).el)],asp:x});
  x=aspect(ca.mars,cb.mars);f.push({k:'marsMars',w:.6,s:x.type==='conjunction'?.6:x.score,asp:x});
  x=aspect(ca.asc,cb.sun);f.push({k:'ascSunAB',w:.5,s:x.score,asp:x});
  x=aspect(cb.asc,ca.sun);f.push({k:'ascSunBA',w:.5,s:x.score,asp:x});
  const W=f.reduce((a,b)=>a+b.w,0),raw=f.reduce((a,b)=>a+b.w*b.s,0)/W;
  return {score:Math.round(Math.max(5,Math.min(99,20+(raw-.3)/.6*75))),raw,factors:f,elKey:elKey(sa.el,sb.el)};
}

/* ============ STATE ============ */
const LS='astro-compat.';
const store={get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',(navigator.language||'').startsWith('cs')?'cs':'en');
let people=store.get('people',null);if(!Array.isArray(people))people=SAMPLES.map(p=>({...p}));
for(const p of people){if(p.city&&!p.place){p.place=p.city;p.cc='';p.admin='';delete p.city}}
let tab=store.get('tab','people'),sel=store.get('sel',null),pairSel=store.get('pair',[null,null]),hsys=store.get('hsys','placidus'),editing=null,formErr='',picked=null,manual=false;
const t=k=>T[lang][k]??k;
const tp=k=>T[lang].tip[k]??'';
const da=s=>s?` data-tip="${esc(s)}"`:'';
const signTip=s=>`${s[lang].n}: ${s[lang].kw.join(', ')}\n${tp('el')[s.el]}\n${tp('mod')[s.mod]}\n${t('ruler')}: ${t(s.ruler.toLowerCase())}`;
const sname=s=>s[lang].n;
const sloc=s=>lang==='cs'?s.cs.loc:`in ${s.en.n}`;
function ensureCharts(){for(const p of people){if(!p.chart){try{p.chart=ENGINE.chart(p,hsys)}catch(e){p.chart=null}}}people=people.filter(p=>p.chart)}
function persist(){store.set('people',people.map(({chart,...p})=>p));store.set('lang',lang);store.set('tab',tab);store.set('sel',sel);store.set('pair',pairSel);store.set('hsys',hsys)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=h=>{const d=document.createElement('template');d.innerHTML=h.trim();return d.content.firstElementChild};

/* ============ RENDER ============ */
function render(){
  ensureCharts();
  if(!people.find(p=>p.id===sel))sel=people[0]?.id??null;
  document.querySelectorAll('[data-i]').forEach(n=>n.textContent=t(n.dataset.i));
  document.getElementById('lang-cs').setAttribute('aria-pressed',lang==='cs');
  document.getElementById('lang-en').setAttribute('aria-pressed',lang==='en');
  document.querySelectorAll('nav.tabs button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===tab);b.dataset.tip=tp(b.dataset.i)});
  document.getElementById('lang-cs').dataset.tip=tp('langCs');document.getElementById('lang-en').dataset.tip=tp('langEn');
  document.documentElement.lang=lang;
  document.getElementById('disclaimer').textContent=(ENGINE.precise?t('engineOk'):t('engineFb'))+' '+t('disclaimer');
  const m=document.getElementById('main');m.replaceChildren();
  ({people:renderPeople,chart:renderChart,traits:renderTraits,compat:renderCompat,matrix:renderMatrix,guide:renderGuide})[tab](m);
  persist();
}

function bornLine(p){const dt=`${p.d}. ${p.m}. ${p.y}`;const tm=p.unknownTime?'':`, ${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`;return `${t('born')} ${dt}${tm}, ${placeLabel(p,false)}`}

      <div class="actions"><button class="btn" data-a="chart"${da(tp('btnChart'))}>${t('tab_chart')}</button><button class="btn" data-a="edit"${da(tp('btnEdit'))}>${t('edit')}</button><button class="btn danger" data-a="del"${da(tp('btnDel'))}>${t('del')}</button></div></div>`);
    card.querySelector('[data-a=chart]').onclick=()=>{sel=p.id;tab='chart';render()};
    card.querySelector('[data-a=edit]').onclick=()=>{editing={...p};picked=p.place&&p.cc?{place:p.place,admin:p.admin,cc:p.cc,lat:p.lat,lon:p.lon,tz:p.tz}:null;manual=!picked;formErr='';render();window.scrollTo({top:0})};
    card.querySelector('[data-a=del]').onclick=e=>{const b=e.currentTarget;if(b.dataset.c){people=people.filter(x=>x.id!==p.id);render()}else{b.dataset.c='1';b.textContent=t('confirmDel')}};

  showPicked();
  let act=-1,cur=[];
  const draw=()=>{if(!cur.length){sug.innerHTML=q.value.trim().length>=2?`<button type="button" disabled class="muted">${t('noMatch')}</button>`:'';sug.hidden=!sug.innerHTML;return}
    sug.innerHTML=cur.map((r,i)=>`<button type="button" class="${i===act?'act':''}" data-i="${i}"><span>${esc(r[0])}${r[3]?`<span class="m">, ${esc(r[3])}</span>`:''}</span><span class="m">${esc(r[2])}${r[7]?' · '+(r[7]>=1e6?(r[7]/1e6).toFixed(1)+' M':r[7]>=1000?Math.round(r[7]/1000)+' k':r[7]):''}</span></button>`).join('');sug.hidden=false;
    sug.querySelectorAll('button[data-i]').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();choose(+b.dataset.i)})};
  const choose=i=>{picked=placeObj(cur[i]);q.value='';cur=[];act=-1;sug.hidden=true;showPicked()};
  q.oninput=()=>{cur=searchPlaces(q.value);act=cur.length?0:-1;draw()};
  q.onkeydown=ev=>{if(ev.key==='ArrowDown'){act=Math.min(cur.length-1,act+1);draw();ev.preventDefault()}else if(ev.key==='ArrowUp'){act=Math.max(0,act-1);draw();ev.preventDefault()}else if(ev.key==='Enter'){ev.preventDefault();if(act>=0)choose(act)}else if(ev.key==='Escape'){sug.hidden=true}};
  q.onblur=()=>setTimeout(()=>{sug.hidden=true},150);

    const name=f.querySelector('#f-name').value.trim(),dv=f.querySelector('#f-date').value,tv=f.querySelector('#f-time').value,unk=f.querySelector('#f-unk').checked;
    editing={...editing,name};

    if(!unk){if(!tv){formErr=t('errTime');render();return}[h,mi]=tv.split(':').map(Number)}
    let loc;
    if(manual){const lat=parseFloat(f.querySelector('#f-lat').value),lon=parseFloat(f.querySelector('#f-lon').value);
      if(isNaN(lat)||isNaN(lon)){formErr=t('errCoords');editing={...editing,place:f.querySelector('#f-pname').value,lat:isNaN(lat)?undefined:lat,lon:isNaN(lon)?undefined:lon,tz:f.querySelector('#f-tz').value};render();return}
      loc={place:f.querySelector('#f-pname').value.trim(),admin:'',cc:'',lat,lon,tz:f.querySelector('#f-tz').value}}
    else{if(!picked){formErr=t('errPlace');render();return}loc=picked}
    const rec={id:e.id||('p'+Date.now().toString(36)),name,y,m:mo,d,h,mi,unknownTime:unk,...loc};
    try{rec.chart=ENGINE.chart(rec,hsys)}catch(err){formErr=String(err);render();return}
    const i=people.findIndex(p=>p.id===rec.id);if(i>=0)people[i]=rec;else people.push(rec);
    editing=null;formErr='';picked=null;sel=rec.id;render()};
  return f;
}

/* --- Chart --- */
function wheelSVG(c){
  const S=520,cx=S/2,cy=S/2,rO=250,rS=215,rH=185,rP=150,rIn=110;
  const ang=L=>(180+(L-c.asc))*Math.PI/180;
  const pt=(L,r)=>[cx+r*Math.cos(ang(L)),cy-r*Math.sin(ang(L))];
  const arc=(L0,L1,r0,r1)=>{const [x0,y0]=pt(L0,r1),[x1,y1]=pt(L1,r1),[x2,y2]=pt(L1,r0),[x3,y3]=pt(L0,r0);return `M${x0},${y0}A${r1},${r1} 0 0 0 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 0 1 ${x3},${y3}Z`};
  let s=`<svg class="wheel" viewBox="0 0 ${S} ${S}" role="img" aria-label="Natal chart wheel"><rect width="${S}" height="${S}" fill="var(--surface)" rx="12"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${rO}" fill="none" stroke="var(--line)"/><circle cx="${cx}" cy="${cy}" r="${rS}" fill="none" stroke="var(--line)"/><circle cx="${cx}" cy="${cy}" r="${rH}" fill="none" stroke="var(--line)"/><circle cx="${cx}" cy="${cy}" r="${rIn}" fill="none" stroke="var(--line)"/>`;
  SIGNS.forEach((sg,i)=>{const L0=i*30,L1=L0+30;s+=`<path d="${arc(L0,L1,rS,rO)}" fill="var(--${sg.el})" fill-opacity="0.14" stroke="var(--line)"${da(signTip(sg))}/>`;const [x,y]=pt(L0+15,(rO+rS)/2);s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="20" fill="var(--${sg.el})" pointer-events="none">${sg.g}</text>`;
    for(let k=5;k<30;k+=5){const [a,b]=pt(L0+k,rS),[d,e]=pt(L0+k,rS+(k%10?4:7));s+=`<line x1="${a}" y1="${b}" x2="${d}" y2="${e}" stroke="var(--line)"/>`}});
  for(let h=1;h<=12;h++){const L=c.cusps[h],Ln=c.cusps[h%12+1];const [x0,y0]=pt(L,rIn),[x1,y1]=pt(L,rS);const major=(h-1)%3===0;s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${major?'var(--fg)':'var(--line)'}" stroke-width="${major?1.5:1}"/>`;const mid=L+ENGINE.rev(Ln-L)/2;const [tx,ty]=pt(mid,(rH+rIn)/2);s+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--muted)" font-family="var(--font-body)"${da(h+'. '+t('house').toLowerCase()+': '+T[lang].houses[h-1])}>${h}</text>`}
  const [ax,ay]=pt(c.asc,rO+12);s+=`<text x="${ax-4}" y="${ay}" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="700" fill="var(--fg)" font-family="var(--font-body)"${da(tp('ac'))}>AC</text>`;
  const [mx,my]=pt(c.mc,rO+12);s+=`<text x="${mx}" y="${my-2}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fg)" font-family="var(--font-body)"${da(tp('mc'))}>MC</text>`;
  const pls=BODIES.slice(0,10).map(([k,g])=>({k,g,L:ENGINE.rev(c[k]),draw:ENGINE.rev(c[k])})).sort((a,b)=>a.L-b.L);
  for(let pass=0;pass<4;pass++)for(let i=0;i<pls.length;i++){const a=pls[i],b=pls[(i+1)%pls.length];let d=ENGINE.rev(b.draw-a.draw);if(d<9){const push=(9-d)/2;a.draw=ENGINE.rev(a.draw-push);b.draw=ENGINE.rev(b.draw+push)}}
  for(let i=0;i<pls.length;i++)for(let j=i+1;j<pls.length;j++){const a=aspect(pls[i].L,pls[j].L);if(a.type==='none'||a.type==='conjunction')continue;const [x0,y0]=pt(pls[i].L,rIn),[x1,y1]=pt(pls[j].L,rIn);const hard=a.type==='square'||a.type==='opposition';s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${hard?'var(--fire)':'var(--earth)'}" stroke-opacity="${a.type==='sextile'?.45:.7}" stroke-width="1"/>`}
  for(const p of pls){const [x,y]=pt(p.draw,rP+10),[tx,ty]=pt(p.L,rH),[ux,uy]=pt(p.draw,rP+24);const sg=signOf(p.L),hn=houseOf(p.L,c.cusps);s+=`<line x1="${tx}" y1="${ty}" x2="${ux}" y2="${uy}" stroke="var(--muted)" stroke-width="1"/><circle cx="${ux}" cy="${uy}" r="2" fill="var(--muted)"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="19" fill="var(--fg)"${da(`${t(p.k)} ${fmtDeg(p.L)} ${sname(sg)}, ${hn}. ${t('house').toLowerCase()}\n${T[lang].mean[p.k]}\n${t('house')} ${hn}: ${T[lang].houses[hn-1]}`)}>${p.g}</text>`;const [dx,dy]=pt(p.draw,rP-10);s+=`<text x="${dx}" y="${dy}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--muted)" font-family="var(--font-body)">${Math.floor(degIn(p.L))}°</text>`}
  return s+'</svg>';
}
function renderChart(m){
  if(!people.length){m.append(el(`<div class="card empty">${t('empty')}</div>`));return}
  m.append(personChips(sel,id=>{sel=id;render()}));
  const p=people.find(x=>x.id===sel),c=p.chart;
  const head=el(`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h2>${esc(p.name)}</h2><p class="muted small">${esc(bornLine(p))}${p.unknownTime?` · ${t('unknownTime').split('(')[0].trim()}`:''}</p></div><label class="hsel"${da(tp('hsys'))}>${t('houseSystem')} <select id="hsys"><option value="placidus" ${hsys==='placidus'?'selected':''}>${t('placidus')}</option><option value="equal" ${hsys==='equal'?'selected':''}>${t('equal')}</option></select>${c.system==='equal'&&hsys==='placidus'?`<span class="muted">(${t('equalForced')})</span>`:''}</label></div>`);
  head.querySelector('#hsys').onchange=ev=>{hsys=ev.target.value;for(const x of people)delete x.chart;render()};
  m.append(head);
  const wrap=el('<div class="chart-wrap"></div>');
  wrap.append(el(`<div class="card" style="padding:8px">${wheelSVG(c)}</div>`));
  let rows='';
  for(const [k,g] of BODIES){const L=c[k],s=signOf(L),hn=houseOf(L,c.cusps);const bodyTip=k==='asc'?tp('ac'):k==='mc'?tp('mc'):`${t(k)}: ${T[lang].mean[k]}`;rows+=`<tr><td class="g"${da(bodyTip)}>${g}</td><td${da(bodyTip)}>${t(k)}</td><td class="sg"${da(signTip(s))}><span class="sw bg-${s.el}"></span>${s.g} ${sname(s)}</td><td class="num"${da(tp('degree'))}>${fmtDeg(L)}</td><td class="num"${da(hn+'. '+t('house').toLowerCase()+': '+T[lang].houses[hn-1])}>${hn}</td><td class="mean"${da(bodyTip)}>${T[lang].mean[k]}</td></tr>`}
  wrap.append(el(`<div class="card" style="padding:8px 4px;overflow-x:auto"><table class="pl"><thead><tr><th></th><th>${t('planet')}</th><th${da(tp('signCell'))}>${t('sign')}</th><th${da(tp('degree'))}>${t('degree')}</th><th${da(tp('houseHdr'))}>${t('house')}</th><th${da(tp('meanHdr'))}>${t('meaning')}</th></tr></thead><tbody>${rows}</tbody></table></div>`));
  m.append(wrap);
  const list=[];const P=BODIES.slice(0,10);
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=aspect(c[P[i][0]],c[P[j][0]]);if(a.type!=='none')list.push({a:P[i],b:P[j],asp:a})}
  list.sort((x,y)=>x.asp.orb-y.asp.orb);
  const cls=a=>a==='conjunction'?'conj':(a==='square'||a==='opposition')?'hard':'soft';
  m.append(el(`<div class="card" style="margin-top:18px"><h3 style="margin-bottom:10px">${t('aspects')}</h3>${list.length?`<div class="asp-list">${list.map(x=>`<div class="a ${cls(x.asp.type)}"${da(tp('asp')[x.asp.type]+'\n'+t(x.a[0])+': '+T[lang].mean[x.a[0]]+'\n'+t(x.b[0])+': '+T[lang].mean[x.b[0]]+'\n'+tp('orb'))}><span class="sym">${ASPSYM[x.asp.type]}</span><span>${x.a[1]} ${t(x.a[0])} – ${x.b[1]} ${t(x.b[0])}</span><span class="muted small num" style="margin-left:auto">${t(x.asp.type)} ${x.asp.orb.toFixed(1)}°</span></div>`).join('')}</div>`:`<p class="muted">${t('noAspects')}</p>`}</div>`));
}

function renderTraits(m){
  if(!people.length){m.append(el(`<div class="card empty">${t('empty')}</div>`));return}

  for(const [k,inKey,lbl,txt] of items){const s=signOf(c[k]);const kw=s[lang].kw.map(w=>`<span class="pill">${w}</span>`).join('');const hn=houseOf(c[k],c.cusps);

  st.append(el(`<div class="card"><h3${da(tp('balance'))}>${t('balance')}</h3><p class="small muted" style="margin-bottom:10px">${t('balanceNote')}</p><div class="grid-2"><div class="bars">${['fire','earth','air','water'].map(k=>bar(k,cnt[k],11,`background:var(--${k})`,tp('el')[k])).join('')}</div><div class="bars">${['cardinal','fixed','mutable'].map(k=>bar(k,mod[k],11,'background:var(--accent)',tp('mod')[k])).join('')}</div></div></div>`));
  m.append(st);
}

/* --- Compatibility --- */
function ringSVG(score){const r=52,C=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${score}"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*score/100} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="600" font-family="var(--font-display)" fill="var(--fg)">${score}</text></svg>`}
const verdict=s=>s>=85?t('v90'):s>=70?t('v75'):s>=55?t('v60'):s>=40?t('v45'):t('v0');
function renderCompat(m){
  if(people.length<2){m.append(el(`<div class="card empty">${t('needTwo')}</div>`));return}
  let [a,b]=pairSel;if(!people.find(p=>p.id===a))a=people[0].id;if(!people.find(p=>p.id===b)||b===a)b=people.find(p=>p.id!==a).id;pairSel=[a,b];
  const opts=id=>people.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} ${signOf(p.chart.sun).g}</option>`).join('');
  const pick=el(`<div class="card pair-pick" style="margin-bottom:18px"><label class="f"${da(tp('pick'))}>${t('pickTwo')}<select id="pa">${opts(a)}</select></label><div class="vs">×</div><label class="f"${da(tp('pick'))}>&nbsp;<select id="pb">${opts(b)}</select></label></div>`);
  pick.querySelector('#pa').onchange=e=>{pairSel=[e.target.value,pairSel[1]];render()};
  pick.querySelector('#pb').onchange=e=>{pairSel=[pairSel[0],e.target.value];render()};
  m.append(pick);
  if(a===b){m.append(el(`<p class="muted">${t('sameTwo')}</p>`));return}
  const A=people.find(p=>p.id===a),B=people.find(p=>p.id===b),r=compat(A,B);
  const sa=signOf(A.chart.sun),sb=signOf(B.chart.sun);
  m.append(el(`<div class="card score" style="margin-bottom:18px"><div${da(tp('ring'))}>${ringSVG(r.score)}</div><div><p class="small muted" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700"${da(tp('ring'))}>${t('score')}</p><h2>${esc(A.name)} × ${esc(B.name)}</h2><p class="verdict" style="margin:4px 0 8px"${da(tp('verdict'))}>${verdict(r.score)}</p><p class="small"><span class="pill"${da(t('sun')+' '+esc(A.name)+'\n'+signTip(sa))}><span class="g el-${sa.el}">${sa.g}</span>${sname(sa)}</span> <span class="pill"${da(t('sun')+' '+esc(B.name)+'\n'+signTip(sb))}><span class="g el-${sb.el}">${sb.g}</span>${sname(sb)}</span></p><p style="margin-top:8px"${da(tp('el')[sa.el]+'\n'+tp('el')[sb.el])}>${T[lang].elpairs[r.elKey]}</p></div></div>`));
  const sorted=[...r.factors].sort((x,y)=>y.w*(y.s-.5)-x.w*(x.s-.5));
  const fx=el(`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>${t('breakdown')}</h3><button class="linkbtn" id="how">${t('howScored')}</button></div><div class="factors"></div></div>`);
  fx.querySelector('#how').onclick=()=>{tab='guide';render();document.getElementById('g6')?.scrollIntoView({behavior:'smooth'})};
  const sub=k=>k.replaceAll('{A}',esc(A.name)).replaceAll('{B}',esc(B.name));
  for(const f of sorted){const P=T[lang].pairs[f.k],pos=f.s>=.5,pts=Math.round((f.s-.5)*f.w*20);
    const asp=f.asp.type==='none'?t('none'):`${ASPSYM[f.asp.type]} ${t(f.asp.type)} (${t('orb')} ${f.asp.orb.toFixed(1)}°)`;
    fx.querySelector('.factors').append(el(`<div class="factor ${pos?'pos':'neg'}"><span class="t">${sub(P[0])} <span class="muted" style="font-weight:500">· ${P[1]}</span></span><span class="s"${da(tp('factor')+'\n'+(lang==='cs'?'Váha':'Weight')+' '+f.w+', '+(lang==='cs'?'hodnota':'value')+' '+f.s.toFixed(2))}>${pts>0?'+':''}${pts}</span><span class="d">${sub(pos?P[2]:P[3])} <span class="muted term"${da(tp('asp')[f.asp.type]+(f.asp.orb!==null?'\n'+tp('orb'):''))}>— ${asp}</span></span></div>`))}
  m.append(fx);
}

/* --- Matrix --- */
function renderMatrix(m){
  if(people.length<2){m.append(el(`<div class="card empty">${t('needTwo')}</div>`));return}
  m.append(el(`<div style="margin-bottom:14px"><h2>${t('matrixTitle')}</h2><p class="muted small">${t('matrixNote')}</p></div>`));
  const n=people.length;const sc=Array.from({length:n},()=>Array(n).fill(null));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){sc[i][j]=sc[j][i]=compat(people[i],people[j]).score}
  let h=`<table class="mx"><thead><tr><th${da(tp('matrixHdr'))}></th>${people.map(p=>`<th class="col"${da(bornLine(p))}>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<n;i++){h+=`<tr><th${da(bornLine(people[i])+'\n'+t('sun')+': '+sname(signOf(people[i].chart.sun)))}>${esc(people[i].name)} <span class="muted">${signOf(people[i].chart.sun).g}</span></th>`;
    for(let j=0;j<n;j++){if(i===j){h+='<td class="self">—</td>';continue}const v=sc[i][j],p=Math.round(Math.max(0,(v-10))/85*100);h+=`<td class="${v>=60?'hi':''}" data-i="${i}" data-j="${j}" style="background:color-mix(in oklab,var(--accent) ${p}%,var(--surface-2))" tabindex="0"${da(`${people[i].name} × ${people[j].name}: ${v} · ${verdict(v)}\n${t('matrixNote')}`)}>${v}</td>`}
    h+='</tr>'}
  h+='</tbody></table>';
  const card=el(`<div class="card"><div class="matrix-wrap">${h}</div><div class="legend"${da(tp('verdict'))}><span>${t('low')}</span><span class="ramp"></span><span>${t('high')}</span></div></div>`);
  card.querySelectorAll('td[data-i]').forEach(td=>{
    const i=+td.dataset.i,j=+td.dataset.j;
    td.onclick=()=>{pairSel=[people[i].id,people[j].id];tab='compat';render()};
    td.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();td.onclick()}};
  });
  m.append(card);
}

/* --- Guide --- */
function renderGuide(m){
  const G=T[lang].guide,L=T[lang];
  const planetsTable=`<table><tr><th></th><th>${t('planet')}</th><th>${t('meaning')}</th></tr>${BODIES.map(([k,g])=>`<tr><td class="g">${g}</td><td>${t(k)}</td><td>${L.mean[k]}</td></tr>`).join('')}</table>`;
  const signsTable=`<table><tr><th></th><th>${t('sign')}</th><th>${t('element')}</th><th>${t('modality')}</th><th>${t('ruler')}</th><th></th></tr>${SIGNS.map(s=>`<tr><td class="g el-${s.el}">${s.g}</td><td>${sname(s)}</td><td>${t(s.el)}</td><td>${t(s.mod)}</td><td>${t(s.ruler.toLowerCase())}</td><td class="muted">${s[lang].kw.join(', ')}</td></tr>`).join('')}</table>`;
  const housesTable=`<table><tr><th>#</th><th>${t('house')}</th></tr>${L.houses.map((h,i)=>`<tr><td class="num">${i+1}</td><td>${h}</td></tr>`).join('')}</table>`;
  const secs=[G.intro,G.big3,G.planets+planetsTable,G.signs+signsTable,G.houses+housesTable,G.aspects,G.score,G.accuracy];
  const g=el(`<div class="guide"><nav>${G.nav.map((n,i)=>`<a href="#g${i}">${n}</a>`).join('')}</nav><article>${secs.map((s,i)=>`<section id="g${i}"><h2>${G.nav[i]}</h2>${s}</section>`).join('')}</article></div>`);
  g.querySelectorAll('nav a').forEach(a=>a.onclick=ev=>{ev.preventDefault();g.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})});
  m.append(g);
}

/* ============ TOOLTIPS (hover, keyboard focus, tap) ============ */
(()=>{
  const tip=document.getElementById('tip');let pinned=null;
  const place=(x,y)=>{const w=tip.offsetWidth,h=tip.offsetHeight;let left=x+12,top=y+16;if(left+w>window.innerWidth-8)left=Math.max(8,window.innerWidth-w-8);if(top+h>window.innerHeight-8)top=Math.max(8,y-h-10);tip.style.left=left+'px';tip.style.top=top+'px'};
  const show=(node,x,y)=>{tip.textContent=node.dataset.tip;tip.hidden=false;place(x,y)};
  const hide=()=>{if(!pinned){tip.hidden=true}};
  const find=e=>e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
  document.addEventListener('mouseover',e=>{const n=find(e);if(n){if(pinned&&pinned!==n)return;show(n,e.clientX,e.clientY)}else hide()});
  document.addEventListener('mousemove',e=>{if(!tip.hidden&&!pinned)place(e.clientX,e.clientY)});
  document.addEventListener('mouseleave',hide);
  document.addEventListener('focusin',e=>{const n=find(e);if(n){const r=n.getBoundingClientRect();show(n,r.left,r.bottom)}});
  document.addEventListener('focusout',hide);
  document.addEventListener('touchstart',e=>{const n=find(e);if(n&&n!==pinned){const r=n.getBoundingClientRect();pinned=n;show(n,r.left,r.bottom);}else{pinned=null;tip.hidden=true}},{passive:true});
  document.addEventListener('scroll',()=>{pinned=null;tip.hidden=true},{passive:true});
})();
